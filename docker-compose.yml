version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: epms_postgres
    restart: always
    environment:
      POSTGRES_USER: epms_user
      POSTGRES_PASSWORD: epms_password
      POSTGRES_DB: epms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epms_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://epms_user:epms_password@db:5432/epms_db
      - SECRET_KEY=super-secret-production-key-change-in-prod-2025
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epms_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
